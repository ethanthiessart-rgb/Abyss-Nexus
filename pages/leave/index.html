<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abyss Nexus — Absences et congés</title><link rel="stylesheet" href="/css/core.css"><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/leave.css"></head><body><div class="dashboard-shell"><aside class="sidebar"></aside><main class="main-panel"><header class="topbar"><div><p class="topbar-kicker">LEAVE MANAGEMENT</p><h1>Absences et congés</h1></div><button id="new-leave" class="primary-action">Nouvelle demande</button></header><section id="leave-list" class="card-list"></section></main></div><dialog id="leave-dialog" class="modal"><form id="leave-form" class="modal-card"><h2>Nouvelle demande</h2><label>Type<select id="leave-type"><option value="leave">Congé</option><option value="absence">Absence</option><option value="unavailability">Indisponibilité</option></select></label><label>Début<input id="leave-start" type="datetime-local" required></label><label>Fin<input id="leave-end" type="datetime-local" required></label><label>Motif<textarea id="leave-reason" rows="5" required></textarea></label><div class="dialog-actions"><button id="cancel-leave" class="secondary-action" type="button">Annuler</button><button class="primary-action" type="submit">Envoyer</button></div></form></dialog><dialog id="review-dialog" class="modal"><form id="review-form" class="modal-card"><h2>Traiter la demande</h2><label>Décision<select id="review-status"><option value="approved">Accepter</option><option value="rejected">Refuser</option></select></label><label>Commentaire<textarea id="review-comment" rows="4"></textarea></label><label>Remplaçant<select id="replacement-user"><option value="">Aucun</option></select></label><div class="dialog-actions"><button id="cancel-review" class="secondary-action" type="button">Annuler</button><button class="primary-action" type="submit">Valider</button></div></form></dialog><div id="toast" class="toast"></div><script src="/js/leave/leave.js" defer></script></body></html>
