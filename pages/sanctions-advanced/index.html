<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abyss Nexus — Sanctions avancées</title><link rel="stylesheet" href="/css/core.css"><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/sanctions-advanced.css"></head><body><div class="dashboard-shell"><aside class="sidebar"></aside><main class="main-panel"><header class="topbar"><div><p class="topbar-kicker">ADVANCED DISCIPLINE</p><h1>Sanctions avancées</h1></div><button id="new-sanction" class="primary-action">Nouvelle sanction</button></header><section id="sanction-list" class="card-list"></section></main></div><dialog id="sanction-dialog" class="modal"><form id="sanction-form" class="modal-card"><h2>Nouvelle sanction</h2><label>Employé<select id="sanction-employee"></select></label><label>Type<select id="sanction-type"><option value="warning">Avertissement</option><option value="mute">Mute</option><option value="kick">Kick</option><option value="exclusion">Exclusion</option><option value="ban">Bannissement</option></select></label><label>Gravité<select id="sanction-severity"><option value="minor">Mineure</option><option value="moderate">Modérée</option><option value="major">Majeure</option><option value="critical">Critique</option></select></label><label>Motif<textarea id="sanction-reason" rows="5"></textarea></label><label>Preuve URL<input id="sanction-evidence" type="url"></label><label>Durée en minutes<input id="sanction-duration" type="number" min="1"></label><label class="checkbox-row"><input id="sanction-validation" type="checkbox" checked> Validation d’un supérieur requise</label><div class="dialog-actions"><button id="cancel-sanction" class="secondary-action" type="button">Annuler</button><button class="primary-action" type="submit">Enregistrer</button></div></form></dialog><div id="toast" class="toast"></div><script src="/js/sanctions-advanced/sanctions-advanced.js" defer></script></body></ht
