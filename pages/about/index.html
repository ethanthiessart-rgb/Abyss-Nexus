<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Abyss Nexus — Version 1.0</title>
  <link rel="stylesheet" href="/css/core.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/about.css">
</head>
<body>
<div class="dashboard-shell">
  <aside class="sidebar"></aside>
  <main class="main-panel">
    <header class="topbar">
      <div>
        <p class="topbar-kicker">ABYSS NEXUS STABLE RELEASE</p>
        <h1>Version 1.0</h1>
      </div>
      <button id="refresh-release" class="primary-action">Relancer les vérifications</button>
    </header>

    <section class="release-hero panel-card">
      <img src="/assets/logos/abyss-nexus-logo.png" alt="">
      <div>
        <span id="release-channel">Stable</span>
        <h2 id="release-name">Abyss Nexus 1.0.0</h2>
        <p id="release-core">Core v1.0</p>
      </div>
    </section>

    <section class="release-grid">
      <article class="panel-card">
        <p class="panel-kicker">VÉRIFICATION D’INTÉGRITÉ</p>
        <div id="release-checks" class="release-checks"></div>
      </article>

      <article class="panel-card">
        <p class="panel-kicker">ÉTAT DU SERVEUR</p>
        <dl id="release-system" class="release-system"></dl>
      </article>

      <article class="panel-card release-wide">
        <p class="panel-kicker">MODULES INCLUS DANS LA VERSION 1.0</p>
        <div id="release-modules" class="release-modules"></div>
      </article>
    </section>
  </main>
</div>

<div id="toast" class="toast"></div>
<script src="/js/about/about.js" defer></script>
</body>
</html>
