<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abyss Nexus — Planning</title><link rel="stylesheet" href="/css/core.css"><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/planning.css"></head><body><div class="dashboard-shell"><aside class="sidebar"></aside><main class="main-panel"><header class="topbar"><div><p class="topbar-kicker">STAFF SCHEDULING</p><h1>Planning du personnel</h1></div><button id="new-shift" class="primary-action">Nouveau service</button></header><section class="planning-toolbar"><input id="planning-from" type="date"><input id="planning-to" type="date"><button id="planning-filter" class="secondary-action">Filtrer</button></section><section id="shift-list" class="shift-list"></section></main></div><dialog id="shift-dialog" class="modal"><form id="shift-form" class="modal-card"><h2>Nouveau service</h2><label>Titre<input id="shift-title" required></label><label>Début<input id="shift-start" type="datetime-local" required></label><label>Fin<input id="shift-end" type="datetime-local" required></label><label>Lieu<input id="shift-location"></label><label>Couleur<input id="shift-color" type="color" value="#3aa9ff"></label><label>Notes<textarea id="shift-notes" rows="4"></textarea></label><fieldset id="shift-members"><legend>Employés affectés</legend></fieldset><div class="dialog-actions"><button id="cancel-shift" class="secondary-action" type="button">Annuler</button><button class="primary-action" type="submit">Créer</button></div></form></dialog><div id="toast" class="toast"></div><script src="/js/planning/planning.js" defer></script></body></html>
