<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Abyss Nexus — Centre système</title>
  <link rel="stylesheet" href="/css/core.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/system-center.css">
</head>
<body>
<div class="dashboard-shell">
  <aside class="sidebar"></aside>
  <main class="main-panel">
    <header class="topbar">
      <div>
        <p class="topbar-kicker">SYSTEM MONITOR</p>
        <h1>Centre système</h1>
      </div>
      <button id="refresh-system" class="primary-action" type="button">
        Actualiser
      </button>
    </header>

    <section class="system-grid">
      <article class="panel-card">
        <p class="panel-kicker">SERVICE</p>
        <dl id="service-data"></dl>
      </article>

      <article class="panel-card">
        <p class="panel-kicker">MÉMOIRE</p>
        <div class="meter">
          <span id="memory-bar"></span>
        </div>
        <strong id="memory-label">—</strong>
        <p id="process-memory">—</p>
      </article>

      <article class="panel-card">
        <p class="panel-kicker">STOCKAGE ABYSS NEXUS</p>
        <dl id="storage-data"></dl>
      </article>

      <article class="panel-card">
        <p class="panel-kicker">BASE DE DONNÉES</p>
        <dl id="database-data"></dl>
      </article>
    </section>
  </main>
</div>

<div id="toast" class="toast"></div>
<script src="/js/system/system.js" defer></script>
</body>
</html>
