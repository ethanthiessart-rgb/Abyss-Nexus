<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abyss Nexus — Rapports avancés</title><link rel="stylesheet" href="/css/core.css"><link rel="stylesheet" href="/css/dashboard.css"><link rel="stylesheet" href="/css/reports-advanced.css"></head><body><div class="dashboard-shell"><aside class="sidebar"></aside><main class="main-panel"><header class="topbar"><div><p class="topbar-kicker">ADVANCED REPORT WORKFLOW</p><h1>Rapports avancés</h1></div><button id="new-report" class="primary-action">Nouveau rapport</button></header><section id="report-list" class="card-list"></section></main></div><dialog id="report-dialog" class="modal"><form id="report-form" class="modal-card"><h2>Nouveau rapport</h2><label>Titre<input id="report-title" required></label><label>Priorité<select id="report-priority"><option value="normal">Normale</option><option value="important">Importante</option><option value="urgent">Urgente</option></select></label><label>Contenu<textarea id="report-content" rows="10" required></textarea></label><label>Pièce jointe URL<input id="report-attachment" type="url"></label><label>Signature<input id="report-signature"></label><fieldset id="report-departments"><legend>Départements destinataires</legend></fieldset><div class="dialog-actions"><button id="save-draft" class="secondary-action" type="button">Brouillon</button><button class="primary-action" type="submit">Envoyer</button></div></form></dialog><div id="toast" class="toast"></div><script src="/js/reports-advanced/reports-advanced.js" defer></script></body></html>
